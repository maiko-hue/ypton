<!DOCTYPE html>
<html lang="es">
<head>
    <script type="module" src="seguridad.js"></script>
    <script>
    if (!localStorage.getItem('sesion_iniciada')) {
        window.location.href = 'index.html';
    }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pagar servicios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/logo_yape_header.png" type="image/png">
    <style>
        * {
            /* Elimina el recuadro azul al hacer clic en celulares */
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
            
            /* Bloquea la selección de texto en toda la app */
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
            box-sizing: border-box;
        }

        /* Excepción para que sí se pueda seleccionar/escribir en los inputs */
        input, textarea {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }

        :root {
            --brand-purple: #742385;
            --brand-dark-purple: #511973;
            --brand-teal: #00BFA5;
            --bg-gray: #f2f4f6;
            --text-dark: #333;
            --text-muted: #888;
            --border-color: #e0e0e0;
        }

        img {
            -webkit-touch-callout: none !important;
            -webkit-user-drag: none !important;
            -webkit-user-select: none !important;
            pointer-events: none;
        }

        body { 
            overscroll-behavior-y: none;
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-gray); 
            color: var(--text-dark); 
            min-height: 100vh;
        }

        .container { 
            max-width: 480px; 
            margin: 0 auto; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }

        /* HEADER HERO (Idéntico a opciones.html) */
        .header-hero {
            background: linear-gradient(135deg, var(--brand-purple) 0%, var(--brand-dark-purple) 100%);
            height: 220px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(81, 25, 115, 0.3);
            flex-shrink: 0;
            padding-bottom: 20px;
        }

        .back-icon {
            position: absolute;
            top: 25px;
            left: 25px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
            z-index: 10;
        }
        .back-icon:active { background: rgba(255,255,255,0.4); }

        .logo-img-custom {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-top: -10px;
            opacity: 0.95;
            filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.2));
        }

        /* TARJETA BLANCA FLOTANTE */
        .info-card {
            background: white;
            margin: -60px 20px 20px 20px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            position: relative;
            z-index: 2;
            animation: slideUp 0.4s ease-out;
            padding-bottom: 30px;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .section-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-muted);
            margin: 0 0 20px 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- Formulario --- */
        .form-group {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--brand-purple); 
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 5px;
        }

        .input-card {
            background-color: white;
            border-radius: 12px;
            padding: 14px 18px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
        }

        .input-card:focus-within {
            border-color: var(--brand-teal);
            box-shadow: 0 2px 8px rgba(0, 191, 165, 0.2);
        }

        .input-icon {
            color: var(--brand-purple);
            font-size: 18px;
            margin-right: 15px;
            width: 24px;
            text-align: center;
            opacity: 0.8;
        }

        .input-field {
            width: 100%;
            background: transparent;
            border: none;
            font-size: 15px;
            color: var(--text-dark);
            outline: none;
            font-family: inherit;
            font-weight: 600;
        }

        .input-field::placeholder {
            color: #aaa;
            font-weight: 400;
        }

        /* --- Botón --- */
        .btn-yapear {
            width: 100%;
            margin-top: 15px;
            padding: 16px;
            border-radius: 30px; 
            border: none;
            background-color: var(--brand-teal); 
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 191, 165, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-yapear:active {
            transform: scale(0.97);
            background-color: #00a892;
        }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- HEADER ESTILO OPCIONES.HTML -->
        <div class="header-hero">
            <i class="fa-solid fa-arrow-left back-icon" onclick="window.location.href='inicio.html'"></i>
            <img src="img/secondlogo.png" alt="Logo" class="logo-img-custom">
        </div>

        <!-- TARJETA FLOTANTE CON EL FORMULARIO -->
        <div class="info-card">
            
            <div class="section-title">Datos</div>

            <div class="form-group">
                <label class="label">Empresa</label>
                <div class="input-card">
                    <i class="fa-solid fa-building input-icon"></i>
                    <input type="text" id="empresa" class="input-field" placeholder="Ej. PagoEfectivo" value="">
                </div>
            </div>

            <div class="form-group">
                <label class="label">Monto a Pagar</label>
                <div class="input-card">
                    <i class="fa-solid fa-sack-dollar input-icon"></i>
                    <input type="number" id="monto" class="input-field" placeholder="0.00" value="">
                </div>
            </div>

            <div class="form-group">
                <label class="label">Nombre del Servicio</label>
                <div class="input-card">
                    <i class="fa-solid fa-bolt input-icon"></i>
                    <input type="text" id="servicio" class="input-field" placeholder="Ej. Luz del Sur" value="">
                </div>
            </div>

            <div class="form-group">
                <label class="label">Código de Cliente</label>
                <div class="input-card">
                    <i class="fa-solid fa-barcode input-icon"></i>
                    <input type="number" id="codigo" class="input-field" placeholder="Ej. 12345678" value="">
                </div>
            </div>

            <div class="form-group">
                <label class="label">Titular</label>
                <div class="input-card">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="titular" class="input-field" placeholder="Nombre completo" value="">
                </div>
            </div>

            <button id="btnYapear" class="btn-yapear">Yapear Servicio</button>

        </div>
    </div>

    <!-- LÓGICA DE JAVASCRIPT INTACTA -->
    <script>
        const btnYapear = document.getElementById('btnYapear');
        
        // Redirección con datos (LÓGICA INTACTA)
        btnYapear.addEventListener('click', () => {
            const empresa = document.getElementById('empresa').value;
            const monto = document.getElementById('monto').value;
            const servicio = document.getElementById('servicio').value;
            const codigo = document.getElementById('codigo').value;
            const titular = document.getElementById('titular').value;

            // Enviamos todo a la página de éxito
            const url = `exito_servicios.html?empresa=${encodeURIComponent(empresa)}&monto=${monto}&servicio=${encodeURIComponent(servicio)}&codigo=${codigo}&titular=${encodeURIComponent(titular)}`;
            
            window.location.href = url;
        });
    </script>
</body>
</html>
