<!DOCTYPE html>
<html lang="es">
<head>
    <script type="module" src="seguridad.js"></script>
    <script>
    if (!localStorage.getItem('sesion_iniciada')) {
        window.location.href = 'index.html';
    }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar QR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/logo_yape_header.png" type="image/png">
    
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        * {
            /* Elimina el recuadro azul al hacer clic en celulares */
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
            
            /* Bloquea la selección de texto en toda la app */
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
            box-sizing: border-box;
        }

        /* Excepción para que sí se pueda seleccionar/escribir en los inputs */
        input, textarea, select {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }

        :root {
            --brand-purple: #742385;
            --brand-dark-purple: #511973;
            --brand-teal: #00BFA5;
            --bg-gray: #f2f4f6;
            --text-dark: #333;
            --text-muted: #888;
            --border-color: #e0e0e0;
            --input-bg: #f9f9fb;
        }

        img {
            -webkit-touch-callout: none !important;
            -webkit-user-drag: none !important;
            -webkit-user-select: none !important;
            pointer-events: none;
        }

        body { 
            overscroll-behavior-y: none;
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-gray); 
            color: var(--text-dark); 
            min-height: 100vh;
        }

        .container { 
            max-width: 480px; 
            margin: 0 auto; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }

        /* --- HEADER HERO (Fondo curvo morado) --- */
        .header-hero {
            background: linear-gradient(135deg, var(--brand-purple) 0%, var(--brand-dark-purple) 100%);
            height: 220px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(81, 25, 115, 0.3);
            flex-shrink: 0;
            padding-bottom: 20px;
        }

        .back-icon {
            position: absolute;
            top: 25px;
            left: 25px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
            z-index: 10;
        }
        .back-icon:active { background: rgba(255,255,255,0.4); }

        .logo-img-custom {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-top: -10px;
            opacity: 0.95;
            filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.2));
        }

        /* --- TARJETA BLANCA FLOTANTE --- */
        .info-card {
            background: white;
            margin: -60px 20px 20px 20px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            position: relative;
            z-index: 2;
            animation: slideUp 0.4s ease-out;
            padding-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--brand-purple);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        /* --- ZONA DE SUBIDA DE IMAGEN --- */
        .upload-area {
            background-color: var(--input-bg); 
            border: 2px dashed #ccc; 
            border-radius: 16px;
            height: 180px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            margin-bottom: 20px; 
            cursor: pointer; 
            position: relative; 
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .upload-area:hover { border-color: var(--brand-purple); background-color: rgba(116, 34, 132, 0.02); }
        
        .upload-icon { font-size: 40px; color: var(--brand-purple); margin-bottom: 10px; opacity: 0.8;}
        .upload-text { font-size: 14px; color: var(--text-muted); font-weight: 600;}
        
        #previewImg {
            width: 100%; height: 100%; object-fit: contain; position: absolute; top:0; left:0; display: none; background: transparent;
        }

        /* --- FORMULARIO Y CAMPOS --- */
        .form-group { margin-bottom: 20px; }
        .label { 
            font-size: 13px; 
            color: var(--brand-purple); 
            text-transform: uppercase; 
            font-weight: 700; 
            margin-bottom: 8px; 
            display: block; 
            letter-spacing: 0.5px; 
            margin-left: 5px;
        }
        
        .input-card {
            background-color: white; border-radius: 12px; padding: 14px 18px;
            border: 1px solid var(--border-color); display: flex; align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02); transition: all 0.3s ease;
        }
        .input-card:focus-within { border-color: var(--brand-teal); box-shadow: 0 2px 8px rgba(0, 191, 165, 0.2); }
        
        .input-field {
            background: transparent; border: none; color: var(--text-dark); width: 100%;
            font-size: 15px; font-weight: 600; outline: none; font-family: inherit;
        }
        .input-field::placeholder { color: #aaa; font-weight: 400; }
        .input-icon { color: var(--brand-purple); font-size: 18px; margin-right: 15px; width: 24px; text-align: center; opacity: 0.8; }

        select.input-field {
            -webkit-appearance: none; appearance: none; background-color: transparent;
        }
        select.input-field option {
            background-color: white; color: var(--text-dark);
        }

        /* --- Botón Guardar --- */
        .btn-save {
            width: 100%; margin-top: 10px; background-color: var(--brand-teal);
            color: white; padding: 16px; border-radius: 30px; border: none; 
            font-size: 16px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 191, 165, 0.3); transition: transform 0.1s, background-color 0.2s;
        }
        .btn-save:active { transform: scale(0.97); background-color: #00a892; }

        /* --- ESTILOS DE TU ANIMACIÓN (PACMAN) --- */
        .custom-loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: none; justify-content: center; align-items: center;
            flex-direction: column; backdrop-filter: blur(4px);
        }

        .loader { width: 8em; height: 8em; }
        .loader__eye1, .loader__eye2, .loader__mouth1, .loader__mouth2 { animation: eye1 3s ease-in-out infinite; }
        .loader__eye1, .loader__eye2 { transform-origin: 64px 64px; }
        .loader__eye2 { animation-name: eye2; }
        .loader__mouth1 { animation-name: mouth1; }
        .loader__mouth2 { animation-name: mouth2; visibility: hidden; }

        @keyframes eye1 {
            from { transform: rotate(-260deg) translate(0, -56px); }
            50%, 60% { animation-timing-function: cubic-bezier(0.17, 0, 0.58, 1); transform: rotate(-40deg) translate(0, -56px) scale(1); }
            to { transform: rotate(225deg) translate(0, -56px) scale(0.35); }
        }
        @keyframes eye2 {
            from { transform: rotate(-260deg) translate(0, -56px); }
            50% { transform: rotate(40deg) translate(0, -56px) rotate(-40deg) scale(1); }
            52.5% { transform: rotate(40deg) translate(0, -56px) rotate(-40deg) scale(1, 0); }
            55%, 70% { animation-timing-function: cubic-bezier(0, 0, 0.28, 1); transform: rotate(40deg) translate(0, -56px) rotate(-40deg) scale(1); }
            to { transform: rotate(150deg) translate(0, -56px) scale(0.4); }
        }
        @keyframes mouth1 {
            from { animation-timing-function: ease-in; stroke-dasharray: 0 351.86; stroke-dashoffset: 0; }
            25% { animation-timing-function: ease-out; stroke-dasharray: 175.93 351.86; stroke-dashoffset: 0; }
            50% { animation-timing-function: steps(1, start); stroke-dasharray: 175.93 351.86; stroke-dashoffset: -175.93; visibility: visible; }
            75%, to { visibility: hidden; }
        }
        @keyframes mouth2 {
            from { animation-timing-function: steps(1, end); visibility: hidden; }
            50% { animation-timing-function: ease-in-out; visibility: visible; stroke-dashoffset: 0; }
            to { stroke-dashoffset: -351.86; }
        }

        /* --- NOTIFICACIÓN PERSONALIZADA (TOAST) --- */
        .toast {
            visibility: hidden; min-width: 250px; margin-left: -125px;
            background-color: #333; color: #fff; text-align: center;
            border-radius: 50px; padding: 16px; position: fixed;
            z-index: 10000; left: 50%; bottom: 30px; font-size: 14px; font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        .toast.show { visibility: visible; opacity: 1; bottom: 50px; }
        .toast.success { background-color: var(--brand-teal); color: white; }
        .toast.error { background-color: #ff5252; color: white; }

    </style>
</head>
<body>
    
    <!-- LOADER PACMAN -->
    <div class="custom-loader-overlay" id="pacmanLoader">
        <svg height="108px" width="108px" viewBox="0 0 128 128" class="loader">
            <defs>
              <clipPath id="loader-eyes">
                <circle transform="rotate(-40,64,64) translate(0,-56)" r="8" cy="64" cx="64" class="loader__eye1"></circle>
                <circle transform="rotate(40,64,64) translate(0,-56)" r="8" cy="64" cx="64" class="loader__eye2"></circle>
              </clipPath>
              <linearGradient y2="1" x2="0" y1="0" x1="0" id="loader-grad">
                <stop stop-color="#000" offset="0%"></stop>
                <stop stop-color="#fff" offset="100%"></stop>
              </linearGradient>
              <mask id="loader-mask">
                <rect fill="url(#loader-grad)" height="128" width="128" y="0" x="0"></rect>
              </mask>
            </defs>
            <g stroke-dasharray="175.93 351.86" stroke-width="12" stroke-linecap="round">
              <g>
                <rect clip-path="url(#loader-eyes)" height="64" width="128" fill="hsl(193,90%,50%)"></rect>
                <g stroke="hsl(193,90%,50%)" fill="none">
                  <circle transform="rotate(180,64,64)" r="56" cy="64" cx="64" class="loader__mouth1"></circle>
                  <circle transform="rotate(0,64,64)" r="56" cy="64" cx="64" class="loader__mouth2"></circle>
                </g>
              </g>
              <g mask="url(#loader-mask)">
                <rect clip-path="url(#loader-eyes)" height="64" width="128" fill="hsl(223,90%,50%)"></rect>
                <g stroke="hsl(223,90%,50%)" fill="none">
                  <circle transform="rotate(180,64,64)" r="56" cy="64" cx="64" class="loader__mouth1"></circle>
                  <circle transform="rotate(0,64,64)" r="56" cy="64" cx="64" class="loader__mouth2"></circle>
                </g>
              </g>
            </g>
        </svg>
        <p style="margin-top:20px; font-weight:600; color:white;">Guardando QR en la Nube...</p>
    </div>

    <div id="toast" class="toast">Mensaje aquí</div>

    <div class="container">
        
        <!-- HEADER ESTILO OPCIONES.HTML -->
        <div class="header-hero">
            <i class="fa-solid fa-arrow-left back-icon" onclick="window.location.href='opciones.html'"></i>
            <img src="img/secondlogo.png" alt="Logo" class="logo-img-custom">
        </div>

        <!-- TARJETA FLOTANTE CON EL FORMULARIO -->
        <div class="info-card">
            <div class="section-title">Nuevo Código QR</div>

            <label class="label">Imagen del QR</label>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                <div class="upload-text">Toca para subir imagen</div>
                <img id="previewImg" src="" alt="QR Preview">
                <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="previewFile()">
            </div>

            <div class="form-group">
                <label class="label">Nombre del Negocio / Persona</label>
                <div class="input-card">
                    <i class="fa-solid fa-store input-icon"></i>
                    <input type="text" id="qrName" class="input-field" placeholder="Bodega Don Pepe">
                </div>
            </div>

            <div class="form-group">
                <label class="label">Destino</label>
                <div class="input-card">
                    <i class="fa-solid fa-building-columns input-icon"></i>
                    <select id="qrDestino" class="input-field">
                        <option value="Yape">Yape</option>
                        <option value="Plin">Plin</option>
                        <option value="BBVA">BBVA</option>
                        <option value="Bim">Bim</option>
                    </select>
                </div>
            </div>

            <button class="btn-save" id="btnGuardarQR">Guardar</button>
        </div>

    </div>

    <!-- LÓGICA DE FIREBASE Y LECTOR QR INTACTA -->
    <script type="module">
        import { db, doc, setDoc } from './firebase.js';

        // Variable global para guardar el código leído
        let scannedQrCode = null;

        window.showToast = function(message, type) {
            var x = document.getElementById("toast");
            x.textContent = message;
            x.className = "toast show " + type;
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // --- FUNCIÓN PARA PREVISUALIZAR Y LEER EL QR ---
        window.previewFile = function() {
            const preview = document.getElementById('previewImg');
            const file = document.querySelector('input[type=file]').files[0];
            const reader = new FileReader();

            reader.addEventListener("load", function () {
                // 1. Mostrar imagen
                preview.src = reader.result;
                preview.style.display = 'block';

                // 2. Intentar leer el QR invisiblemente
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    context.drawImage(img, 0, 0, img.width, img.height);
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    
                    // Usar librería jsQR
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        scannedQrCode = code.data;
                        console.log("QR Leído:", scannedQrCode);
                        showToast("Código QR detectado correctamente", "success");
                    } else {
                        scannedQrCode = null;
                        showToast("No se detectó ningún QR en la imagen", "error");
                    }
                };
                img.src = reader.result;

            }, false);

            if (file) {
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('btnGuardarQR').addEventListener('click', async () => {
            const name = document.getElementById('qrName').value;
            const destino = document.getElementById('qrDestino').value; // CAPTURAMOS EL DESTINO
            const imgCheck = document.getElementById('previewImg').src;
            const loader = document.getElementById('pacmanLoader');

            // VALIDACIÓN
            if(!imgCheck || imgCheck === "" || document.getElementById('fileInput').files.length === 0) {
                showToast("Falta subir la imagen", "error");
                return;
            }
            if(name.trim() === "") {
                showToast("Falta el nombre", "error");
                return;
            }
            if(!scannedQrCode) {
                showToast("La imagen no contiene un QR válido", "error");
                return;
            }

            // SI TODO ESTÁ BIEN:
            loader.style.display = 'flex';

            try {
                // Usamos el código QR como ID (sanitizado)
                const safeId = scannedQrCode.replace(/\//g, '_slash_');

                // GUARDAR EN FIREBASE (Colección 'codigos_qr')
                await setDoc(doc(db, "codigos_qr", safeId), {
                    nombre: name,
                    destino: destino, // GUARDAMOS EL DESTINO (Yape, Plin, etc.)
                    codigo_original: scannedQrCode,
                    fecha: new Date().toISOString()
                });
                
                // ÉXITO
                loader.style.display = 'none';
                showToast("¡QR Guardado en la Nube!", "success");

                setTimeout(() => {
                    window.location.href = 'opciones.html';
                }, 1500);

            } catch (e) {
                console.error(e);
                loader.style.display = 'none';
                showToast("Error al guardar en la nube", "error");
            }
        });
    </script>
</body>
</html>
