<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nos mudamos</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        body { background: #742385; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
        .logo-container { margin-bottom: 30px; animation: float 3s ease-in-out infinite; }
        .logo-container img { width: 120px; height: 120px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); object-fit: contain; }
        h1 { font-size: 24px; font-weight: 800; margin-bottom: 15px; }
        p.subtitle { font-size: 16px; font-weight: 600; color: #e1bceb; margin-bottom: 30px; line-height: 1.5; }
        .btn-container { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 15px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; border-radius: 30px; font-size: 16px; font-weight: 700; text-decoration: none; color: white; transition: transform 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn:active { transform: scale(0.96); }
        .btn-main { background: #00BFA5; }
        .btn-secondary { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); }
        
        .info-box { margin-top: 40px; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 15px; display: flex; align-items: flex-start; gap: 12px; text-align: left; max-width: 340px; border: 1px solid rgba(255,255,255,0.1); }
        .info-box svg { width: 24px; height: 24px; flex-shrink: 0; fill: #00BFA5; margin-top: 2px; }
        .info-box p { font-size: 13px; color: #f0f0f0; line-height: 1.5; }

        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }

        .floating-bubble-buy { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; align-items: center; text-decoration: none; z-index: 100; animation: floatBubble 3s ease-in-out infinite; }
        .bubble-img-wrapper { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; border: 3px solid #00BFA5; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 5px; }
        .bubble-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .bubble-text-buy { background: rgba(0,0,0,0.7); color: white; font-size: 11px; padding: 4px 8px; border-radius: 10px; font-weight: 700; white-space: nowrap; backdrop-filter: blur(2px); }
        @keyframes floatBubble { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="img/secondlogo.png" alt="Logo" onerror="this.src='img/icon.png'; this.onerror=null;">
    </div>

    <h1>¡Nos mudamos a otra versión!</h1>
    <p class="subtitle">Descarga tu APK y obtén tu link en el grupo oficial.</p>

    <div class="btn-container">
        <a href="https://t.me/appsreborn" class="btn btn-main">
            <i class="fa-brands fa-telegram" style="font-size: 20px;"></i> Grupo Oficial
        </a>
        <a href="https://t.me/appsreborn_dev" class="btn btn-secondary">
            <i class="fa-solid fa-life-ring"></i> Respaldo
        </a>
        <a href="https://www.appsreborn.shop/" class="btn btn-secondary">
            <i class="fa-solid fa-globe"></i> Web Oficial
        </a>
    </div>

    <div class="info-box">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
        </svg>
        <p>Si has comprado esta app, en el grupo VIP está toda la info de la v.5.0, dale una chequeada.</p>
    </div>

    <a href="https://t.me/MaikolEsleiter" class="floating-bubble-buy">
        <div class="bubble-img-wrapper">
            <img src="img/photo_2026-05-31_20-35-06.jpg" alt="Comprar">
        </div>
        <span class="bubble-text-buy">Click aquí para comprar acceso</span>
    </a>

    <script>
        // Limpiar localStorage y caché para forzar salida total si el usuario usaba la app
        localStorage.clear();
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) caches.delete(name);
            });
        }
    </script>
</body>
</html>
